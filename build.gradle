plugins {
    id 'idea'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '0.8.4' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.88' apply false
}

def javaVersion = 17

version = mod_version
group = mod_group_id

allprojects {
    task optimizePng {
        def pngPatterns = ["**/*.png"]
        doFirst {
            println 'Executing oxipng task...'
        }
        doLast {
            //Ensure the logo is minimized (we add this file to each jar)
            //Minimize any PNGs in the source sets
            for (dir in sourceSets.main.resources.srcDirs) {
                fileTree(dir: dir, includes: pngPatterns).each { minimizePNGFile(it) }
            }
            println 'Finished oxipng task...'
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'me.modmuss50.mod-publish-plugin'
    project.group = rootProject.group
    project.version = rootProject.version

    tasks.build.mustRunAfter tasks.clean
    tasks.publish.mustRunAfter tasks.build
    tasks.publishMods.mustRunAfter tasks.publish
    tasks.register('buildAndRelease') {
        dependsOn(tasks.clean, tasks.build, tasks.publish, tasks.publishMods)
    }

    base {
        archivesName.set(mod_id)
    }

    version = "${rootProject.mod_version}+${rootProject.minecraft_version}-${project.name}"

    repositories {
        maven {
            url = 'https://maven.parchmentmc.org'
            content {
                includeGroup 'org.parchmentmc.data'
            }
        }
        maven {
            url = 'https://maven.shedaniel.me'
            content {
                includeGroup 'me.shedaniel.cloth'
                includeGroup 'me.shedaniel'
            }
        }
        maven {
            url = 'https://www.cursemaven.com'
            content {
                includeGroup 'curse.maven'
            }
        }
        maven {
            url = 'https://api.modrinth.com/maven/'
            content {
                includeGroup 'maven.modrinth'
            }
        }
        maven {
            name = 'Ladysnake Mods'
            url = 'https://maven.ladysnake.org/releases'
            content {
                includeGroup 'io.github.ladysnake'
                includeGroupByRegex 'dev\\.onyxstudios.*'
            }
        }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
            content {
                includeGroupByRegex 'dev\\.emi.*'
            }
        }
        maven {
            url = 'https://maven.blamejared.com'
            content {
                includeGroup 'mezz.jei'
            }
        }
        maven {
            url = 'https://nexus.resourcefulbees.com/repository/maven-public/'
            content {
                includeGroup 'com.telepathicgrunt'
                includeGroup 'earth.terrarium.athena'
            }
        }
        maven {
            url = "https://maven.theillusivec4.top/"
            content {
                includeGroup 'top.theillusivec4.curios'
            }
        }
        maven {
            url "https://maven.jamieswhiteshirt.com/libs-release"
            content {
                includeGroup "com.jamieswhiteshirt"
            }
        }
        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
            content {
                includeGroup 'com.hollingsworth.ars_nouveau'
            }
        }
        maven {
            url 'https://modmaven.dev/'
            content {
                includeGroup 'mekanism'
            }
        }
        maven {
            url = 'https://maven.cafeteria.dev/releases/'
            content {
                includeGroup 'me.luligabi'
            }
        }
        maven {
            url = 'https://maven.architectury.dev/'
            content {
                includeGroup 'dev.architectury'
            }
        }
        maven {
            name = 'GeckoLib'
            url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroupByRegex("software\\.bernie.*")
                includeGroup("com.eliotlash.mclib")
            }
        }
    }

    dependencies {
        compileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"
    }

    processResources {
        filteringCharset "UTF-8"

        def expandProps = [
                "version"              : project.version,
                "maven_group_id"       : project.mod_group_id,
                "mod_id"               : project.mod_id,
                "mod_display_name"     : project.mod_name,
                "mod_description"      : project.mod_description,
                "mod_author"           : project.mod_author,
                "mod_credits"          : project.mod_credits,
                "sources_url"          : project.sources_url,
                "issues_url"           : project.issues_url,
                "homepage_url_forge"   : project.homepage_url_forge,
                "homepage_url_fabric"  : project.homepage_url_fabric,
                "license_url"          : project.license_url,
                "license"              : project.license,
                "logo_forge"           : project.license,
                "logo_fabric"          : project.license,

                "minecraft_version"    : project.minecraft_version,
                "forge_version"        : project.forge_version,
                "fabric_loader_version": project.fabric_loader_version,
                "java_version"         : "${javaVersion}",
        ]

        filesMatching(['pack.mcmeta', '*.mod.json', 'META-INF/mods.toml', '*.mixins.json']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }

    java {
        if (JavaVersion.current() < JavaVersion.toVersion(javaVersion)) {
            toolchain {
                languageVersion = JavaLanguageVersion.of(javaVersion)
            }
        } else {
            sourceCompatibility = JavaVersion.toVersion(javaVersion)
            targetCompatibility = JavaVersion.toVersion(javaVersion)
        }

        withSourcesJar()
//        withJavadocJar()
    }

    javadoc {
        // make javadoc not throw on mixin's '@reason'
        options.tags = ["reason"]
    }

    jar {
        def licenseFile1 = rootProject.file("LICENSE.txt")
        def licenseFile2 = rootProject.file("LICENSE_ASSETS.txt")
        inputs.file(licenseFile1)
        inputs.file(licenseFile2)

        from(licenseFile1) {
            rename { "LICENSE.txt" }
        }
        from(licenseFile2) {
            rename { "LICENSE_ASSETS.txt" }
        }
    }

    sourcesJar {
        def licenseFile1 = rootProject.file("LICENSE.txt")
        def licenseFile2 = rootProject.file("LICENSE_ASSETS.txt")
        inputs.file(licenseFile1)
        inputs.file(licenseFile2)

        from(licenseFile1) {
            rename { "LICENSE.txt" }
        }
        from(licenseFile2) {
            rename { "LICENSE_ASSETS.txt" }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release.set(javaVersion)
    }

    project.tasks.publishMods.mustRunAfter project.tasks.publish
    project.tasks.buildAndRelease.dependsOn(project.tasks.publish).dependsOn(project.tasks.publishMods)

    publishing {
        publications {
            "mavenJava${project.name}"(MavenPublication) {
                from components.java
                artifactId "TheBumblezone"

                pom {
                    name = project.mod_name
                    description = project.mod_description
                    url = project.sources_url

                    scm {
                        connection = "git:${project.sources_url}.git"
                        developerConnection = "git:${project.sources_url}.git"
                        url = project.sources_url
                    }

                    licenses {
                        license {
                            name = project.license
                            url = project.license_url
                        }
                    }

                    developers {
                        developer {
                            id = 'telepathic_grunt'
                            name = 'TelepathicGrunt'
                            email = 'asarnesespam@gmail.com'
                        }
                    }
                }

            }
        }
    }

    publishMods {
        type = STABLE

        displayName = "${project.mod_name} v${rootProject.mod_version} (${rootProject.minecraft_version} MC ${name.capitalize()})"
        version = project.version

        def changeLogFile = project.file("CHANGELOG.md")
        changelog = changeLogFile.exists() ? changeLogFile.text : ""
    }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


////////////////////////////////////////////RELEASING/////////////////////////////////////////////

def ENV = System.getenv()
publishing {
    repositories {
        if (ENV.MAVEN_USER) {
            maven {
                url = uri("https://nexus.resourcefulbees.com/repository/telepathicgrunt/")
                credentials {
                    username ENV.MAVEN_USER
                    password ENV.MAVEN_PASS
                }
            }
        }
    }
}

//Minimize/optimize all png files, requires optipng on the PATH
// Credits: BrainStone
void minimizePNGFile(File file) {
    exec {
        executable "./oxipng.exe"
        args "-o", "6", "-i", "0", "--strip", "all", "-a", "-Z", file
    }
}