plugins {
    id 'fabric-loom'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "ParchmentMC"
                url = "https://maven.parchmentmc.org"
            }
        }
        filter {
            includeGroupAndSubgroups("org.parchmentmc")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.terraformersmc.com/releases"
            }
        }
        filter {
            includeGroupAndSubgroups("com.terraformersmc")
        }
    }
}

dependencies {
    // REQUIRED
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings(loom.layered {
        it.officialMojangMappings()
        it.parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
    })
    compileOnly(project.project(":common")) {
        transitive = false
    }

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modImplementation("maven.modrinth:midnightlib:${project.midnightlib}")
    modRuntimeOnly(modCompileOnly(include("earth.terrarium.athena:athena-fabric-${project.athena}")))
    modRuntimeOnly(modCompileOnly(include("com.teamresourceful.resourcefullib:resourcefullib-fabric-${project.resourcefullib}")))

    // COMPAT
    modCompileOnly("noobanidus.mods.lootr:lootr-fabric:${project.lootr_version}")
    //modRuntimeOnly("noobanidus.mods.lootr:lootr-fabric:${project.lootr_version}")

    modCompileOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") {
        transitive = false
    }
    modLocalRuntime("com.terraformersmc:modmenu:${project.mod_menu_version}") {
        transitive = false
    }

    //modCompileOnly("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components}") { transitive false }
    //modCompileOnly("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components}") { transitive false }
    modCompileOnly("dev.emi:trinkets:${project.trinkets}") { transitive false }
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config}")
    //modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config}")
    modCompileOnly("curse.maven:restricted_portals-228266:${project.restricted_portals_file_id}")

    modCompileOnly("mezz.jei:jei-${project.jei_mc}-fabric:${project.jei}")
    modCompileOnly("mezz.jei:jei-${project.jei_mc}-common:${project.jei}")

    modCompileOnly("dev.emi:emi-xplat-intermediary:${project.emi}:api")

    modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei}") { transitive = false  }
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin:${project.rei}")

    modCompileOnly("maven.modrinth:projectile-damage-attribute:${project.projectile_damage_attribute}-fabric") { transitive = false  }

//    modLocalRuntime("com.telepathicgrunt:CommandStructures-Fabric:${project.commandstructures_fabric}")
//    modLocalRuntime("com.telepathicgrunt:StructureVoidToggle-Fabric:${project.structurevoidtoggle_fabric}")
}

publishMods {
    file = tasks.remapJar.archiveFile
    modLoaders.add("fabric")

    File changeLog = project.file("CHANGELOG.md")
    String changeLogText = changeLog.exists() ? changeLog.text : ""

    def uploadDependenciesCf = [
            "fabric-api": true,
            "midnightlib": true,
            "resourceful-lib": true,
            "better-advancements": false
    ]
    def uploadDependenciesMr = [
            "fabric-api": true,
            "midnightlib": true,
            "resourceful-lib": true,
            "better-advancements": false
    ]

    if (project.hasProperty('curseforge_id_fabric')) {
        curseforge('curseforgeFabric') {
            accessToken = providers.environmentVariable('CURSEFORGEKEY')
            projectId = project.findProperty('curseforge_id_fabric')
            minecraftVersions.add(project.minecraft_version)
            changelog = changeLogText

            uploadDependenciesCf.each { dep, required ->
                if (required) {
                    requires(dep)
                } else {
                    optional(dep)
                }
            }
        }
    }

    if (project.hasProperty('modrinth_id_fabric')) {
        modrinth('modrinthFabric') {
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            projectId = project.findProperty('modrinth_id_fabric')
            minecraftVersions.add(project.minecraft_version)
            changelog = changeLogText

            dependencies {
                uploadDependenciesMr.each { dep, required ->
                    if (required) {
                        requires(dep)
                    } else {
                        optional(dep)
                    }
                }
            }
        }
    }
}

loom {
    mods {
        "${mod_id}" {
            // Tell Loom about each source set used by your mod here. This ensures that your mod's classes are properly transformed by Loader.
            sourceSet sourceSets.main
            sourceSet project.project(":common").sourceSets.main
        }
    }

    def awFile = project.file("src/main/resources/${mod_id}.accesswidener")
    if (awFile.exists()) {
        accessWidenerPath.set(awFile)
    }

    runs {
        configureEach {
            runDir("run")
            ideConfigGenerated(true)
        }

        client {
            client()
            setConfigName("Fabric Client")

            if (project.hasProperty('mc_uuid')) {
                programArg("--uuid=${project.findProperty('mc_uuid')}")
            }

            if (project.hasProperty('mc_username')) {
                programArg("--username=${project.findProperty('mc_username')}")
            }

            if (project.hasProperty('mc_java_agent_path')) {
                vmArg("-javaagent:${project.findProperty('mc_java_agent_path')}")
            }
        }

        server {
            server()
            setConfigName("Fabric Server")
            programArg('--nogui')
        }
    }
}

tasks.named("compileJava", JavaCompile) {
    source(project.project(":common").sourceSets.main.allJava)
}

tasks.named("javadoc", Javadoc).configure {
    source(project.project(":common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    from(project.project(":common").sourceSets.main.allSource)
}

processResources {
    from project.project(":common").sourceSets.main.resources
}
