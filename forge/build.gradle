plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.142'
}

repositories {
    maven { url = 'https://maven.fabricmc.net' }
    exclusiveContent {
        forRepository {
            maven {
                name = "ModMaven"
                url = "https://modmaven.dev"
            }
        }
        filter {
            includeGroupAndSubgroups("com.hollingsworth.ars_nouveau")
            includeGroupAndSubgroups("mekanism")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "C4's Maven"
                url = "https://maven.theillusivec4.top/"
            }
        }
        filter {
            includeGroupAndSubgroups("top.theillusivec4.curios")
            includeGroupAndSubgroups("com.illusivesoulworks.caelus")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroup('software.bernie.geckolib')
        }
    }
    maven {
        url "https://maven.jamieswhiteshirt.com/libs-release"
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }
}

