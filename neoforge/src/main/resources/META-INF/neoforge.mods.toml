modLoader="javafml"
loaderVersion="[2,)"
license="MIT"
issueTrackerURL="${issues_url}"
sourcesUrl="${sources_url}"

[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_display_name}"
    displayURL="${homepage_url}"
    logoFile= "assets/the_bumblezone/the_bumblezone_logo_large.png"
    logoBlur=false
    authors="TelepathicGrunt"
    description='''${mod_description}'''
    credits="Thanks to Commoble for suggesting this awesome name for this mod! Special thanks to all the Forge tutorials and debugging help from other modders to help make this mod possible!"

[[mixins]]
    config = "the_bumblezone-neoforge.mixins.json"

[[mixins]]
    config = "the_bumblezone-common.mixins.json"

[dependencies]
"${mod_id}" = [
    { modId = "neoforge", type = "required", versionRange = "[21.1.0,)", ordering = "NONE", side = "BOTH" },
    { modId = "minecraft", type = "required", versionRange = "[1.21.1,1.22)", ordering = "NONE", side = "BOTH" },
    { modId = "resourcefullib", type = "required", versionRange = "[3.0.11,)", ordering = "NONE", side = "BOTH" },
    { modId = "structureessentials", type = "incompatible", versionRange = "[4.5]", reason="Structure Essentials v4.5 completely destroys Bumblezone's dimension. Downgrade or upgrade Structure Essentials off of v4.5." },
]
